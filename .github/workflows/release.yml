# Release builds: Windows .exe, Linux binary, and Docker image.
#
# - Push a tag like `v5.2.0` (or run manually) to build everything.
# - Binaries are attached to the GitHub Release; the Docker image is pushed
#   to GHCR (ghcr.io/remlover-dev/rems-dl:<tag> + :latest).
# - PyInstaller is NOT cross-platform: the Windows .exe is built on
#   windows-latest and the Linux binary on ubuntu-latest. Never cross-build.
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller Rems_Dl.spec --noconfirm
      - name: Bundle offline tag databases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/Rems_Dl/database" | Out-Null
          Copy-Item -Path "database/*.json" -Destination "dist/Rems_Dl/database/" -Force
          if (Test-Path -LiteralPath "database/tag_caches") {
            Copy-Item -Path "database/tag_caches" -Destination "dist/Rems_Dl/database/tag_caches" -Recurse -Force
          }
          if (Test-Path -LiteralPath ".env.example") {
            Copy-Item -Path ".env.example" -Destination "dist/Rems_Dl/" -Force
          }
      - name: Zip + checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Rems_Dl" -DestinationPath "Rems_Dl-Windows.zip" -Force
          (Get-FileHash "Rems_Dl-Windows.zip" -Algorithm SHA256).Hash | Out-File "Rems_Dl-Windows.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rems-dl-windows
          path: |
            Rems_Dl-Windows.zip
            Rems_Dl-Windows.zip.sha256

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller Rems_Dl.spec --noconfirm
      - name: Bundle offline tag databases
        run: |
          mkdir -p dist/Rems_Dl/database
          cp database/*.json dist/Rems_Dl/database/ || true
          if [ -d database/tag_caches ]; then cp -r database/tag_caches dist/Rems_Dl/database/; fi
          if [ -f .env.example ]; then cp .env.example dist/Rems_Dl/; fi
      - name: Tarball + checksum
        run: |
          tar -czf Rems_Dl-Linux.tar.gz -C dist Rems_Dl
          sha256sum Rems_Dl-Linux.tar.gz | cut -d' ' -f1 > Rems_Dl-Linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rems-dl-linux
          path: |
            Rems_Dl-Linux.tar.gz
            Rems_Dl-Linux.tar.gz.sha256

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/rems-dl-windows/*
            artifacts/rems-dl-linux/*
