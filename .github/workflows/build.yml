name: Build Application - Windows and Linux

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (x64) Installer & Portable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: |
          pytest

      - name: Download Visual C++ Redistributable
        run: |
          New-Item -ItemType Directory -Force -Path dependencies
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dependencies\vc_redist.x64.exe"

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean Rems_Dl.spec

      - name: Build Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Package Portable Zip
        run: |
          Compress-Archive -Path "dist\Rems_Dl\*" -DestinationPath "dist_installer\Rems-Dl-Windows-x64-Portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rems-Dl-Windows-x64
          path: |
            dist_installer/Rems-Dl-Windows-x64-Setup.exe
            dist_installer/Rems-Dl-Windows-x64-Portable.zip
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rem 5.2 - Rems Dl v5.2.0
          body_path: RELEASE_NOTES.md
          files: |
            dist_installer/Rems-Dl-Windows-x64-Setup.exe
            dist_installer/Rems-Dl-Windows-x64-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (x86_64) Binary & Tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK & PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-dev \
            gobject-introspection \
            meson \
            ninja-build
          sudo apt-get install -y libgirepository-2.0-dev 2>/dev/null || sudo apt-get install -y libgirepository1.0-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          pip install PyGObject || echo "PyGObject pip notice: system packages will be used"

      - name: Run tests
        run: |
          pytest

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean Rems_Dl.spec

      - name: Prepare Linux distribution bundle
        run: |
          mkdir -p dist_linux
          cp Rems_Dl.desktop dist/Rems_Dl/
          chmod +x dist/Rems_Dl/Rems_Dl
          tar -czvf dist_linux/Rems-Dl-Linux-x86_64.tar.gz -C dist Rems_Dl

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rems-Dl-Linux-x86_64
          path: dist_linux/Rems-Dl-Linux-x86_64.tar.gz
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rem 5.2 - Rems Dl v5.2.0
          body_path: RELEASE_NOTES.md
          files: dist_linux/Rems-Dl-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
